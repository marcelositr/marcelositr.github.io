name: Temporary Social Preview Build

on:
  push:
    branches:
      - agent/social-metadata-polish
    paths:
      - .github/workflows/social-preview-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/social-metadata-polish

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build optimized 1200x630 PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps

          source = Image.open('assets/images/social-preview.png').convert('RGB')
          preview = ImageOps.fit(
              source,
              (1200, 630),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.5),
          )
          preview = preview.quantize(colors=256, method=Image.Quantize.MEDIANCUT)
          preview.save('assets/images/social-preview.png', 'PNG', optimize=True)
          PY
          rm -f assets/images/social-preview.jpg

      - name: Commit generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/images/social-preview.png assets/images/social-preview.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Optimize social preview image'
          git push origin HEAD:agent/social-metadata-polish
