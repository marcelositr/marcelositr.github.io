name: Lighthouse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Static Server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/devnux-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/devnux-http.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://127.0.0.1:4173/pt/
            http://127.0.0.1:4173/pt/meio-ambiente/
            http://127.0.0.1:4173/pt/tecnologia/
            http://127.0.0.1:4173/pt/radio/
            http://127.0.0.1:4173/pt/meliponicultura/
            http://127.0.0.1:4173/caderno/
          uploadArtifacts: true
          temporaryPublicStorage: true
