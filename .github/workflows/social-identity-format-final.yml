name: Temporary Social Identity Format Final

on:
  push:
    branches:
      - agent/social-identity-consistency
    paths:
      - .github/workflows/social-identity-format-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-identity-consistency

      - name: Fix page title block indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/scripts/site.js')
          text = path.read_text(encoding='utf-8')
          pattern = r"  const pageTitles = \{.*?\n\};(?=\n\n  if \(currentSection === 'notebook'\))"
          match = re.search(pattern, text, flags=re.S)
          if not match:
              raise SystemExit('pageTitles block not found')
          lines = match.group(0).splitlines()
          formatted = '\n'.join([lines[0], *['  ' + line for line in lines[1:]]])
          if formatted == match.group(0):
              raise SystemExit('formatting produced no change')
          text = text[:match.start()] + formatted + text[match.end():]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/social-identity-format-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scripts/site.js .github/workflows/social-identity-format-final.yml
          git commit -m 'Polish title block indentation'
          git push origin HEAD:agent/social-identity-consistency
