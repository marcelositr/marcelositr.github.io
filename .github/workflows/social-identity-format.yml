name: Temporary Social Identity Format

on:
  push:
    branches:
      - agent/social-identity-consistency
    paths:
      - .github/workflows/social-identity-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-identity-consistency

      - name: Restore page title block formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/scripts/site.js')
          text = path.read_text(encoding='utf-8')
          block = """  const pageTitles = {
            home: {
              pt: 'DEVNUX | Marcelo Trindade',
              en: 'DEVNUX | Marcelo Trindade',
              es: 'DEVNUX | Marcelo Trindade'
            },
            environment: {
              pt: 'Meio ambiente | DEVNUX',
              en: 'Environment | DEVNUX',
              es: 'Medio ambiente | DEVNUX'
            },
            technology: {
              pt: 'Tecnologia | DEVNUX',
              en: 'Technology | DEVNUX',
              es: 'Tecnología | DEVNUX'
            },
            radio: {
              pt: 'Radioamadorismo | DEVNUX',
              en: 'Amateur radio | DEVNUX',
              es: 'Radioafición | DEVNUX'
            },
            meliponiculture: {
              pt: 'Meliponicultura | DEVNUX',
              en: 'Meliponiculture | DEVNUX',
              es: 'Meliponicultura | DEVNUX'
            }
          };"""
          text, count = re.subn(
              r"  const pageTitles = \{.*?\n\};(?=\n\n  if \(currentSection === 'notebook'\))",
              block,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('pageTitles block not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/social-identity-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scripts/site.js .github/workflows/social-identity-format.yml
          git commit -m 'Polish title block formatting'
          git push origin HEAD:agent/social-identity-consistency
